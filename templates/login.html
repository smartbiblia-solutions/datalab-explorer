{% extends "base.html" %}
{% block title %}{{ _('login.title') }} · {{ config.SITE_TITLE }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card mt-4">
      <div class="card-header"><h3 class="text-center h4 my-1">{{ _('login.title') }}</h3></div>
      <div class="card-body">
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label for="username" class="form-label">{{ _('login.username') }}</label>
            <input type="text" class="form-control" id="username" name="username" autocomplete="username" required autofocus>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">{{ _('login.password') }}</label>
            <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
          </div>
          <div class="d-grid"><button type="submit" class="btn btn-primary">{{ _('nav.login') }}</button></div>
        </form>
      </div>
    </div>
    <p class="text-muted small mt-3">{{ _('login.help') }} <code>flask --app app add-user NOM</code></p>
  </div>
</div>
{% endblock %}
