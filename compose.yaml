services:
  web:
    build: .
    image: datalab-explorer:latest
    restart: unless-stopped
    ports:
      - "${DATALAB_BIND_ADDRESS:-127.0.0.1}:${DATALAB_PORT:-5000}:5000"
    environment:
      DATALAB_API_HOSTS: ${DATALAB_API_HOSTS:-api.openalex.org}
    #volumes:
    #  - studio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  studio-data:
