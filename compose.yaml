services:
  web:
    build: .
    image: datalab-explorer:latest
    restart: unless-stopped
    ports:
      - "${DATALAB_BIND_ADDRESS:-127.0.0.1}:${DATALAB_PORT:-5000}:5000"
    environment:
      DATALAB_TITLE: ${DATALAB_TITLE:-DataLab Explorer}
      DATALAB_LANG: ${DATALAB_LANG:-fr}
    volumes:
      - datalab-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s

volumes:
  datalab-data:
